<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Open-LLM-Vtuber</title>
    <script>
      // Clear old OLV v1.2.1 localStorage cache (port 12393)
      (function() {
        var keys = ['wsUrl', 'baseUrl', 'backgroundUrl', 'modelInfo'];
        for (var i = 0; i < keys.length; i++) {
          var val = localStorage.getItem(keys[i]);
          if (val && val.indexOf('12393') !== -1) {
            localStorage.removeItem(keys[i]);
            console.log('[Bridge] Cleared stale localStorage: ' + keys[i]);
          }
        }
      })();
    </script>
    <script type="module" src="./assets/main-nu7uwxNJ.js"></script>
    <link rel="stylesheet" href="./assets/main-QEkl09-0.css" />
  </head>

  </body>
</html>

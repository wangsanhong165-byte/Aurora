<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monika</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="portrait-area">
    <img id="portrait" src="/portrait/neutral" alt="Monika">
  </div>
  <div id="chat">
    <div id="messages"></div>
  </div>
  <div id="input-bar">
    <input id="user-input" type="text" placeholder="Say something..." autocomplete="off">
    <button id="send-btn" title="Send">&#10148;</button>
  </div>
  <div id="status-bar">
    <span id="status-text">Monika is here</span>
  </div>
</div>
<audio id="tts-player" preload="none"></audio>
<script src="app.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1760" viewBox="0 0 1500 1760"><rect width="1500" height="1760" fill="#0d1117"/><rect width="1500" height="86" fill="#172235"/><circle cx="32" cy="32" r="8" fill="#f87171"/><circle cx="58" cy="32" r="8" fill="#fbbf24"/><circle cx="84" cy="32" r="8" fill="#4ade80"/><text x="120" y="38" fill="#e8edf5" font-family="Segoe UI,Microsoft YaHei" font-size="25" font-weight="700">项目工程结构与核心代码</text><text x="120" y="68" fill="#7dd3fc" font-family="Consolas,monospace" font-size="15">frontend/src/character/CharacterView.tsx</text><style>.code{font:16px Consolas,"Cascadia Code",monospace;fill:#dbe7f5;white-space:pre}.ln{fill:#60748e}.kw{fill:#c084fc}</style><text x="60" y="122" class="code"><tspan class="ln">  1</tspan>// Character View — Live2D model display component with ModelManager</text><text x="60" y="145" class="code"><tspan class="ln">  2</tspan>// Uses CubismWebFramework for rendering</text><text x="60" y="168" class="code"><tspan class="ln">  3</tspan></text><text x="60" y="191" class="code"><tspan class="ln">  4</tspan>import { memo, useRef, useEffect, useState, useCallback } from 'react'</text><text x="60" y="214" class="code"><tspan class="ln">  5</tspan>import { useSelector, selectCharacter, selectSettings } from '../core/store'</text><text x="60" y="237" class="code"><tspan class="ln">  6</tspan>import { theme } from '../core/theme'</text><text x="60" y="260" class="code"><tspan class="ln">  7</tspan>import { eventBus } from '../core/event-bus'</text><text x="60" y="283" class="code"><tspan class="ln">  8</tspan>import { initRenderer, resizeRenderer, destroyRenderer, render, setViewOffset, setViewScale, resetView, getViewTransform } from './live2d/renderer'</text><text x="60" y="306" class="code"><tspan class="ln">  9</tspan>import { ModelManager, type ModelState } from './live2d/ModelManager'</text><text x="60" y="329" class="code"><tspan class="ln"> 10</tspan>import { CharacterController } from './controllers'</text><text x="60" y="352" class="code"><tspan class="ln"> 11</tspan>import { initCubismFramework, disposeCubismFramework } from './live2d/core'</text><text x="60" y="375" class="code"><tspan class="ln"> 12</tspan>import { PetModeController } from './PetModeController'</text><text x="60" y="398" class="code"><tspan class="ln"> 13</tspan>import { AvatarController } from './AvatarController'</text><text x="60" y="421" class="code"><tspan class="ln"> 14</tspan>import { ComponentManager } from './ComponentManager'</text><text x="60" y="444" class="code"><tspan class="ln"> 15</tspan>import { Live2DModelAdapter } from './Live2DModelAdapter'</text><text x="60" y="467" class="code"><tspan class="ln"> 16</tspan>import { observeElementResize } from './observe-resize'</text><text x="60" y="490" class="code"><tspan class="ln"> 17</tspan>import { normalizeAvatarViewport } from './AvatarCapabilityProfile'</text><text x="60" y="513" class="code"><tspan class="ln"> 18</tspan>import { resolveLive2DRenderDpr } from './Live2DPerformanceSettings'</text><text x="60" y="536" class="code"><tspan class="ln"> 19</tspan>import { isWindowDragging } from './window-drag-state'</text><text x="60" y="559" class="code"><tspan class="ln"> 20</tspan>import { readPersistedViewport, savePersistedViewport } from './live2d/viewport-persistence'</text><text x="60" y="582" class="code"><tspan class="ln"> 21</tspan></text><text x="60" y="605" class="code"><tspan class="ln"> 22</tspan>function modelUrl(name: string): string {</text><text x="60" y="628" class="code"><tspan class="ln"> 23</tspan>  return `/live2d-models/${name}/${name}.model3.json`</text><text x="60" y="651" class="code"><tspan class="ln"> 24</tspan>}</text><text x="60" y="674" class="code"><tspan class="ln"> 25</tspan></text><text x="60" y="697" class="code"><tspan class="ln"> 26</tspan>function applyModelViewport(modelName: string): void {</text><text x="60" y="720" class="code"><tspan class="ln"> 27</tspan>  const profiles = (window as any).__INITIAL_MODEL_INFO__?.avatarProfiles as</text><text x="60" y="743" class="code"><tspan class="ln"> 28</tspan>    | Record&lt;string, { viewport?: { x?: number; y?: number; scale?: number } }&gt;</text><text x="60" y="766" class="code"><tspan class="ln"> 29</tspan>    | undefined</text><text x="60" y="789" class="code"><tspan class="ln"> 30</tspan>  let persisted</text><text x="60" y="812" class="code"><tspan class="ln"> 31</tspan>  try {</text><text x="60" y="835" class="code"><tspan class="ln"> 32</tspan>    persisted = readPersistedViewport(window.localStorage, modelName)</text><text x="60" y="858" class="code"><tspan class="ln"> 33</tspan>  } catch (_) {</text><text x="60" y="881" class="code"><tspan class="ln"> 34</tspan>    persisted = undefined</text><text x="60" y="904" class="code"><tspan class="ln"> 35</tspan>  }</text><text x="60" y="927" class="code"><tspan class="ln"> 36</tspan>  const viewport = normalizeAvatarViewport(persisted ?? profiles?.[modelName]?.viewport)</text><text x="60" y="950" class="code"><tspan class="ln"> 37</tspan>  resetView()</text><text x="60" y="973" class="code"><tspan class="ln"> 38</tspan>  setViewScale(viewport.scale)</text><text x="60" y="996" class="code"><tspan class="ln"> 39</tspan>  setViewOffset(viewport.x, viewport.y)</text><text x="60" y="1019" class="code"><tspan class="ln"> 40</tspan>}</text><text x="60" y="1042" class="code"><tspan class="ln"> 41</tspan></text><text x="60" y="1065" class="code"><tspan class="ln"> 42</tspan>function persistModelViewport(modelName: string): void {</text><text x="60" y="1088" class="code"><tspan class="ln"> 43</tspan>  if (!modelName) return</text><text x="60" y="1111" class="code"><tspan class="ln"> 44</tspan>  try {</text><text x="60" y="1134" class="code"><tspan class="ln"> 45</tspan>    savePersistedViewport(window.localStorage, modelName, getViewTransform())</text><text x="60" y="1157" class="code"><tspan class="ln"> 46</tspan>  } catch (_) {}</text><text x="60" y="1180" class="code"><tspan class="ln"> 47</tspan>}</text><text x="60" y="1203" class="code"><tspan class="ln"> 48</tspan></text><text x="60" y="1226" class="code"><tspan class="ln"> 49</tspan>/** Initialize components from avatar config or fallback to legacy accessories.</text><text x="60" y="1249" class="code"><tspan class="ln"> 50</tspan> *  Looks up per-model config from the full avatar config injected by the server. */</text><text x="60" y="1272" class="code"><tspan class="ln"> 51</tspan>function _initComponents(compMgr: ComponentManager, ctrl: CharacterController,</text><text x="60" y="1295" class="code"><tspan class="ln"> 52</tspan>                         modelName: string): void {</text><text x="60" y="1318" class="code"><tspan class="ln"> 53</tspan>  // Clear previous model's accessory state to avoid stale labels</text><text x="60" y="1341" class="code"><tspan class="ln"> 54</tspan>  ctrl.clearAccessories()</text><text x="60" y="1364" class="code"><tspan class="ln"> 55</tspan></text><text x="60" y="1387" class="code"><tspan class="ln"> 56</tspan>  try {</text><text x="60" y="1410" class="code"><tspan class="ln"> 57</tspan>    const initInfo = (window as any).__INITIAL_MODEL_INFO__</text><text x="60" y="1433" class="code"><tspan class="ln"> 58</tspan>    const avatarCfg = initInfo?.avatar</text><text x="60" y="1456" class="code"><tspan class="ln"> 59</tspan></text><text x="60" y="1479" class="code"><tspan class="ln"> 60</tspan>    // Per-model config: look up modelName key in the full avatar_cfg dict</text><text x="60" y="1502" class="code"><tspan class="ln"> 61</tspan>    const modelCfg = (avatarCfg &amp;&amp; typeof avatarCfg === 'object' &amp;&amp; avatarCfg[modelName])</text><text x="60" y="1525" class="code"><tspan class="ln"> 62</tspan>      ? avatarCfg[modelName]</text><text x="60" y="1548" class="code"><tspan class="ln"> 63</tspan>      : (avatarCfg?.components ? avatarCfg : null)</text><text x="60" y="1571" class="code"><tspan class="ln"> 64</tspan></text><text x="60" y="1594" class="code"><tspan class="ln"> 65</tspan>    if (modelCfg) {</text><text x="60" y="1617" class="code"><tspan class="ln"> 66</tspan>      const avatarComponents = modelCfg.components</text><text x="60" y="1640" class="code"><tspan class="ln"> 67</tspan></text><text x="60" y="1663" class="code"><tspan class="ln"> 68</tspan>      // Build parts/state arrays regardless of whether components are empty.</text><text x="60" y="1686" class="code"><tspan class="ln"> 69</tspan>      // IMPORTANT: When components is {} (empty), still emit empty state to clear UI.</text><text x="60" y="1709" class="code"><tspan class="ln"> 70</tspan>      // Do NOT fall through to legacy fallback — that uses the INITIAL model's</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2220" viewBox="0 0 1500 2220"><rect width="1500" height="2220" fill="#0d1117"/><rect width="1500" height="86" fill="#172235"/><circle cx="32" cy="32" r="8" fill="#f87171"/><circle cx="58" cy="32" r="8" fill="#fbbf24"/><circle cx="84" cy="32" r="8" fill="#4ade80"/><text x="120" y="38" fill="#e8edf5" font-family="Segoe UI,Microsoft YaHei" font-size="25" font-weight="700">Live2D 角色表现控制开发</text><text x="120" y="68" fill="#7dd3fc" font-family="Consolas,monospace" font-size="15">frontend/src/character/ParameterMixer.ts</text><style>.code{font:16px Consolas,"Cascadia Code",monospace;fill:#dbe7f5;white-space:pre}.ln{fill:#60748e}.kw{fill:#c084fc}</style><text x="60" y="122" class="code"><tspan class="ln">  1</tspan>// Parameter Mixer — resolves conflicts when multiple subsystems write to the</text><text x="60" y="145" class="code"><tspan class="ln">  2</tspan>// same Cubism parameter. This is the SINGLE arbitration point for all</text><text x="60" y="168" class="code"><tspan class="ln">  3</tspan>// real-time parameter contributions.</text><text x="60" y="191" class="code"><tspan class="ln">  4</tspan>//</text><text x="60" y="214" class="code"><tspan class="ln">  5</tspan>// Flow:</text><text x="60" y="237" class="code"><tspan class="ln">  6</tspan>//   1. Each subsystem submits ParameterContribution objects via submit() or setParams()</text><text x="60" y="260" class="code"><tspan class="ln">  7</tspan>//   2. At resolve(), the mixer arbitrates per-parameter conflicts</text><text x="60" y="283" class="code"><tspan class="ln">  8</tspan>//   3. apply() writes final values to the Live2DModelAdapter</text><text x="60" y="306" class="code"><tspan class="ln">  9</tspan>//</text><text x="60" y="329" class="code"><tspan class="ln"> 10</tspan>// Priority conventions:</text><text x="60" y="352" class="code"><tspan class="ln"> 11</tspan>//   system safety/reset:  100</text><text x="60" y="375" class="code"><tspan class="ln"> 12</tspan>//   ui/debug override:     90</text><text x="60" y="398" class="code"><tspan class="ln"> 13</tspan>//   ai motion:             80</text><text x="60" y="421" class="code"><tspan class="ln"> 14</tspan>//   ai expression:         75</text><text x="60" y="444" class="code"><tspan class="ln"> 15</tspan>//   motion playback:       50</text><text x="60" y="467" class="code"><tspan class="ln"> 16</tspan>//   lip_sync:              76  (must own mouth.open while audio is active)</text><text x="60" y="490" class="code"><tspan class="ln"> 17</tspan>//   pet interaction:       60</text><text x="60" y="513" class="code"><tspan class="ln"> 18</tspan>//   gaze:                  30</text><text x="60" y="536" class="code"><tspan class="ln"> 19</tspan>//   blink:                 40  (absolute override when eyes closing)</text><text x="60" y="559" class="code"><tspan class="ln"> 20</tspan>//   breath:                20</text><text x="60" y="582" class="code"><tspan class="ln"> 21</tspan>//   ambient performance:   24</text><text x="60" y="605" class="code"><tspan class="ln"> 22</tspan>//</text><text x="60" y="628" class="code"><tspan class="ln"> 23</tspan>// Channels:</text><text x="60" y="651" class="code"><tspan class="ln"> 24</tspan>//   motion, expression, lip_sync, eye, head, body, blink, breath, accessory, pose</text><text x="60" y="674" class="code"><tspan class="ln"> 25</tspan></text><text x="60" y="697" class="code"><tspan class="ln"> 26</tspan>import type { Live2DModelAdapter } from './Live2DModelAdapter'</text><text x="60" y="720" class="code"><tspan class="ln"> 27</tspan></text><text x="60" y="743" class="code"><tspan class="ln"> 28</tspan>export type ControlSource =</text><text x="60" y="766" class="code"><tspan class="ln"> 29</tspan>  | 'system'</text><text x="60" y="789" class="code"><tspan class="ln"> 30</tspan>  | 'runtime'</text><text x="60" y="812" class="code"><tspan class="ln"> 31</tspan>  | 'ai'</text><text x="60" y="835" class="code"><tspan class="ln"> 32</tspan>  | 'speech'</text><text x="60" y="858" class="code"><tspan class="ln"> 33</tspan>  | 'mouse'</text><text x="60" y="881" class="code"><tspan class="ln"> 34</tspan>  | 'idle'</text><text x="60" y="904" class="code"><tspan class="ln"> 35</tspan>  | 'pet'</text><text x="60" y="927" class="code"><tspan class="ln"> 36</tspan>  | 'ui'</text><text x="60" y="950" class="code"><tspan class="ln"> 37</tspan>  | 'debug'</text><text x="60" y="973" class="code"><tspan class="ln"> 38</tspan></text><text x="60" y="996" class="code"><tspan class="ln"> 39</tspan>export type ControlChannel =</text><text x="60" y="1019" class="code"><tspan class="ln"> 40</tspan>  | 'expression'</text><text x="60" y="1042" class="code"><tspan class="ln"> 41</tspan>  | 'lip_sync'</text><text x="60" y="1065" class="code"><tspan class="ln"> 42</tspan>  | 'eye'</text><text x="60" y="1088" class="code"><tspan class="ln"> 43</tspan>  | 'head'</text><text x="60" y="1111" class="code"><tspan class="ln"> 44</tspan>  | 'body'</text><text x="60" y="1134" class="code"><tspan class="ln"> 45</tspan>  | 'blink'</text><text x="60" y="1157" class="code"><tspan class="ln"> 46</tspan>  | 'breath'</text><text x="60" y="1180" class="code"><tspan class="ln"> 47</tspan>  | 'accessory'</text><text x="60" y="1203" class="code"><tspan class="ln"> 48</tspan>  | 'pose'</text><text x="60" y="1226" class="code"><tspan class="ln"> 49</tspan>  | 'calibration'</text><text x="60" y="1249" class="code"><tspan class="ln"> 50</tspan>  | 'motion'</text><text x="60" y="1272" class="code"><tspan class="ln"> 51</tspan></text><text x="60" y="1295" class="code"><tspan class="ln"> 52</tspan>export interface ParameterContribution {</text><text x="60" y="1318" class="code"><tspan class="ln"> 53</tspan>  /** Unique contribution ID for deduplication. */</text><text x="60" y="1341" class="code"><tspan class="ln"> 54</tspan>  id: string</text><text x="60" y="1364" class="code"><tspan class="ln"> 55</tspan>  /** Cubism parameter ID, e.g. &quot;ParamAngleX&quot;. */</text><text x="60" y="1387" class="code"><tspan class="ln"> 56</tspan>  parameterId: string</text><text x="60" y="1410" class="code"><tspan class="ln"> 57</tspan>  /** Source identifier for debugging. */</text><text x="60" y="1433" class="code"><tspan class="ln"> 58</tspan>  source: string</text><text x="60" y="1456" class="code"><tspan class="ln"> 59</tspan>  /** Control channel for arbitration grouping. */</text><text x="60" y="1479" class="code"><tspan class="ln"> 60</tspan>  channel: ControlChannel</text><text x="60" y="1502" class="code"><tspan class="ln"> 61</tspan>  /** Parameter value. */</text><text x="60" y="1525" class="code"><tspan class="ln"> 62</tspan>  value: number</text><text x="60" y="1548" class="code"><tspan class="ln"> 63</tspan>  /** How this contribution combines with the resolved base value. */</text><text x="60" y="1571" class="code"><tspan class="ln"> 64</tspan>  mode?: 'override' | 'add' | 'multiply'</text><text x="60" y="1594" class="code"><tspan class="ln"> 65</tspan>  /** Priority (higher = wins conflicts). */</text><text x="60" y="1617" class="code"><tspan class="ln"> 66</tspan>  priority: number</text><text x="60" y="1640" class="code"><tspan class="ln"> 67</tspan>  /** Optional weight for blended contributions. */</text><text x="60" y="1663" class="code"><tspan class="ln"> 68</tspan>  weight?: number</text><text x="60" y="1686" class="code"><tspan class="ln"> 69</tspan>  /** Timestamp when this contribution was created. */</text><text x="60" y="1709" class="code"><tspan class="ln"> 70</tspan>  createdAt: number</text><text x="60" y="1732" class="code"><tspan class="ln"> 71</tspan>  /** Optional expiry — contribution is removed after this time. */</text><text x="60" y="1755" class="code"><tspan class="ln"> 72</tspan>  expiresAt?: number</text><text x="60" y="1778" class="code"><tspan class="ln"> 73</tspan>  /** Preserve this contribution across frames until explicitly removed. */</text><text x="60" y="1801" class="code"><tspan class="ln"> 74</tspan>  persistent?: boolean</text><text x="60" y="1824" class="code"><tspan class="ln"> 75</tspan>}</text><text x="60" y="1847" class="code"><tspan class="ln"> 76</tspan></text><text x="60" y="1870" class="code"><tspan class="ln"> 77</tspan>export interface PartOpacityContribution {</text><text x="60" y="1893" class="code"><tspan class="ln"> 78</tspan>  id: string</text><text x="60" y="1916" class="code"><tspan class="ln"> 79</tspan>  partId: string</text><text x="60" y="1939" class="code"><tspan class="ln"> 80</tspan>  opacity: number</text><text x="60" y="1962" class="code"><tspan class="ln"> 81</tspan>  priority: number</text><text x="60" y="1985" class="code"><tspan class="ln"> 82</tspan>  weight?: number</text><text x="60" y="2008" class="code"><tspan class="ln"> 83</tspan>  persistent?: boolean</text><text x="60" y="2031" class="code"><tspan class="ln"> 84</tspan>}</text><text x="60" y="2054" class="code"><tspan class="ln"> 85</tspan></text><text x="60" y="2077" class="code"><tspan class="ln"> 86</tspan>interface ParameterOwner {</text><text x="60" y="2100" class="code"><tspan class="ln"> 87</tspan>  name: string</text><text x="60" y="2123" class="code"><tspan class="ln"> 88</tspan>  paramIds: string[]</text><text x="60" y="2146" class="code"><tspan class="ln"> 89</tspan>  priority: number</text><text x="60" y="2169" class="code"><tspan class="ln"> 90</tspan>  maskWeight: number</text></svg>
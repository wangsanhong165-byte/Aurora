<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2220" viewBox="0 0 1500 2220"><rect width="1500" height="2220" fill="#0d1117"/><rect width="1500" height="86" fill="#172235"/><circle cx="32" cy="32" r="8" fill="#f87171"/><circle cx="58" cy="32" r="8" fill="#fbbf24"/><circle cx="84" cy="32" r="8" fill="#4ade80"/><text x="120" y="38" fill="#e8edf5" font-family="Segoe UI,Microsoft YaHei" font-size="25" font-weight="700">AI 与语音模块开发</text><text x="120" y="68" fill="#7dd3fc" font-family="Consolas,monospace" font-size="15">app/modules/tts/api.py</text><style>.code{font:16px Consolas,"Cascadia Code",monospace;fill:#dbe7f5;white-space:pre}.ln{fill:#60748e}.kw{fill:#c084fc}</style><text x="60" y="122" class="code"><tspan class="ln">  1</tspan>&quot;&quot;&quot;TTS API — multi-engine router powered by TTSFactory.</text><text x="60" y="145" class="code"><tspan class="ln">  2</tspan></text><text x="60" y="168" class="code"><tspan class="ln">  3</tspan>Set TTS_ENGINE in .env to switch:</text><text x="60" y="191" class="code"><tspan class="ln">  4</tspan>  qwen3-tts   -&gt; local Qwen3TTS model</text><text x="60" y="214" class="code"><tspan class="ln">  5</tspan>  gsvi         -&gt; legacy GPT-SoVITS (OpenAI-compatible HTTP)</text><text x="60" y="237" class="code"><tspan class="ln">  6</tspan>  gsvi-v2pro   -&gt; GPT-SoVITS v2Pro nvidia50 (/tts endpoint)</text><text x="60" y="260" class="code"><tspan class="ln">  7</tspan>  edge-tts     -&gt; Microsoft Edge TTS (cloud, free)</text><text x="60" y="283" class="code"><tspan class="ln">  8</tspan>  cloud-tts    -&gt; external cloud TTS API</text><text x="60" y="306" class="code"><tspan class="ln">  9</tspan>  pyttsx3      -&gt; system TTS fallback</text><text x="60" y="329" class="code"><tspan class="ln"> 10</tspan>&quot;&quot;&quot;</text><text x="60" y="352" class="code"><tspan class="ln"> 11</tspan></text><text x="60" y="375" class="code"><tspan class="ln"> 12</tspan>from __future__ import annotations</text><text x="60" y="398" class="code"><tspan class="ln"> 13</tspan></text><text x="60" y="421" class="code"><tspan class="ln"> 14</tspan>import argparse</text><text x="60" y="444" class="code"><tspan class="ln"> 15</tspan>import os</text><text x="60" y="467" class="code"><tspan class="ln"> 16</tspan>from pathlib import Path</text><text x="60" y="490" class="code"><tspan class="ln"> 17</tspan>from typing import Any</text><text x="60" y="513" class="code"><tspan class="ln"> 18</tspan></text><text x="60" y="536" class="code"><tspan class="ln"> 19</tspan>from fastapi import Body, FastAPI, HTTPException</text><text x="60" y="559" class="code"><tspan class="ln"> 20</tspan>from fastapi.responses import Response</text><text x="60" y="582" class="code"><tspan class="ln"> 21</tspan></text><text x="60" y="605" class="code"><tspan class="ln"> 22</tspan>from app.config_manager.service_config import service_config</text><text x="60" y="628" class="code"><tspan class="ln"> 23</tspan>from app.core.config import UVICORN_LOG_CONFIG, DEFAULT_ENV_PATH, DEFAULT_TTS_ENGINE, load_env_file</text><text x="60" y="651" class="code"><tspan class="ln"> 24</tspan>from app.core.schemas import TTSRequest, TTSResponse</text><text x="60" y="674" class="code"><tspan class="ln"> 25</tspan>from app.modules.tts.factory import TTSFactory</text><text x="60" y="697" class="code"><tspan class="ln"> 26</tspan># Import engines so @TTSFactory.register decorators fire at import time</text><text x="60" y="720" class="code"><tspan class="ln"> 27</tspan>from app.modules.tts.engines import (  # noqa: F401</text><text x="60" y="743" class="code"><tspan class="ln"> 28</tspan>    EdgeTTS,</text><text x="60" y="766" class="code"><tspan class="ln"> 29</tspan>    GSVITTS,</text><text x="60" y="789" class="code"><tspan class="ln"> 30</tspan>    GSVIV2TTS,</text><text x="60" y="812" class="code"><tspan class="ln"> 31</tspan>    QwenTTS,</text><text x="60" y="835" class="code"><tspan class="ln"> 32</tspan>    Pyttsx3TTS,</text><text x="60" y="858" class="code"><tspan class="ln"> 33</tspan>    CloudTTS,</text><text x="60" y="881" class="code"><tspan class="ln"> 34</tspan>)</text><text x="60" y="904" class="code"><tspan class="ln"> 35</tspan></text><text x="60" y="927" class="code"><tspan class="ln"> 36</tspan></text><text x="60" y="950" class="code"><tspan class="ln"> 37</tspan>app = FastAPI(title=&quot;Local TTS API&quot;, version=&quot;3.1.0&quot;)</text><text x="60" y="973" class="code"><tspan class="ln"> 38</tspan></text><text x="60" y="996" class="code"><tspan class="ln"> 39</tspan># Keep the selected engine alive for the lifetime of the service.  In</text><text x="60" y="1019" class="code"><tspan class="ln"> 40</tspan># particular, GSVI keeps its selected remote weights warm after startup.</text><text x="60" y="1042" class="code"><tspan class="ln"> 41</tspan>_engines: dict[str, Any] = {}</text><text x="60" y="1065" class="code"><tspan class="ln"> 42</tspan>_engine_error = &quot;&quot;</text><text x="60" y="1088" class="code"><tspan class="ln"> 43</tspan>_engine_warm = False</text><text x="60" y="1111" class="code"><tspan class="ln"> 44</tspan></text><text x="60" y="1134" class="code"><tspan class="ln"> 45</tspan></text><text x="60" y="1157" class="code"><tspan class="ln"> 46</tspan>def _resolve_engine(request: TTSRequest | None = None) -&gt; str:</text><text x="60" y="1180" class="code"><tspan class="ln"> 47</tspan>    &quot;&quot;&quot;Return engine name: request.engine &gt; env &gt; DEFAULT_TTS_ENGINE.&quot;&quot;&quot;</text><text x="60" y="1203" class="code"><tspan class="ln"> 48</tspan>    if request and request.engine:</text><text x="60" y="1226" class="code"><tspan class="ln"> 49</tspan>        return request.engine</text><text x="60" y="1249" class="code"><tspan class="ln"> 50</tspan>    return DEFAULT_TTS_ENGINE</text><text x="60" y="1272" class="code"><tspan class="ln"> 51</tspan></text><text x="60" y="1295" class="code"><tspan class="ln"> 52</tspan></text><text x="60" y="1318" class="code"><tspan class="ln"> 53</tspan># ================================================================</text><text x="60" y="1341" class="code"><tspan class="ln"> 54</tspan>#  Endpoints</text><text x="60" y="1364" class="code"><tspan class="ln"> 55</tspan># ================================================================</text><text x="60" y="1387" class="code"><tspan class="ln"> 56</tspan></text><text x="60" y="1410" class="code"><tspan class="ln"> 57</tspan></text><text x="60" y="1433" class="code"><tspan class="ln"> 58</tspan>_config: Any = None</text><text x="60" y="1456" class="code"><tspan class="ln"> 59</tspan></text><text x="60" y="1479" class="code"><tspan class="ln"> 60</tspan></text><text x="60" y="1502" class="code"><tspan class="ln"> 61</tspan>_engine_configs: dict = {}</text><text x="60" y="1525" class="code"><tspan class="ln"> 62</tspan></text><text x="60" y="1548" class="code"><tspan class="ln"> 63</tspan></text><text x="60" y="1571" class="code"><tspan class="ln"> 64</tspan>def _get_tts_config(engine_name: str | None = None) -&gt; Any:</text><text x="60" y="1594" class="code"><tspan class="ln"> 65</tspan>    &quot;&quot;&quot;Load TTS config for *engine_name*, or default engine if omitted.&quot;&quot;&quot;</text><text x="60" y="1617" class="code"><tspan class="ln"> 66</tspan>    global _engine_configs</text><text x="60" y="1640" class="code"><tspan class="ln"> 67</tspan>    if not _engine_configs:</text><text x="60" y="1663" class="code"><tspan class="ln"> 68</tspan>        try:</text><text x="60" y="1686" class="code"><tspan class="ln"> 69</tspan>            from app.config_manager import load_and_validate</text><text x="60" y="1709" class="code"><tspan class="ln"> 70</tspan>            cfg = load_and_validate()</text><text x="60" y="1732" class="code"><tspan class="ln"> 71</tspan>            for eng_key in (&quot;gsvi-v2pro&quot;, &quot;qwen3-tts&quot;, &quot;edge-tts&quot;, &quot;pyttsx3&quot;, &quot;cloud-tts&quot;):</text><text x="60" y="1755" class="code"><tspan class="ln"> 72</tspan>                eng = getattr(cfg.tts, eng_key.replace(&quot;-&quot;, &quot;_&quot;), None)</text><text x="60" y="1778" class="code"><tspan class="ln"> 73</tspan>                if eng is not None:</text><text x="60" y="1801" class="code"><tspan class="ln"> 74</tspan>                    _engine_configs[eng_key] = eng</text><text x="60" y="1824" class="code"><tspan class="ln"> 75</tspan>            _engine_configs[&quot;_default&quot;] = cfg.tts.engine</text><text x="60" y="1847" class="code"><tspan class="ln"> 76</tspan>        except Exception as exc:</text><text x="60" y="1870" class="code"><tspan class="ln"> 77</tspan>            print(f&quot;[TTS] Config load skipped: {exc}&quot;)</text><text x="60" y="1893" class="code"><tspan class="ln"> 78</tspan>            return None</text><text x="60" y="1916" class="code"><tspan class="ln"> 79</tspan>    key = engine_name or _engine_configs.get(&quot;_default&quot;, &quot;gsvi-v2pro&quot;)</text><text x="60" y="1939" class="code"><tspan class="ln"> 80</tspan>    return _engine_configs.get(key)</text><text x="60" y="1962" class="code"><tspan class="ln"> 81</tspan></text><text x="60" y="1985" class="code"><tspan class="ln"> 82</tspan></text><text x="60" y="2008" class="code"><tspan class="ln"> 83</tspan>def _get_engine(engine_name: str | None = None) -&gt; Any:</text><text x="60" y="2031" class="code"><tspan class="ln"> 84</tspan>    name = engine_name or DEFAULT_TTS_ENGINE</text><text x="60" y="2054" class="code"><tspan class="ln"> 85</tspan>    if name not in _engines:</text><text x="60" y="2077" class="code"><tspan class="ln"> 86</tspan>        _engines[name] = TTSFactory.create(name, config=_get_tts_config(name))</text><text x="60" y="2100" class="code"><tspan class="ln"> 87</tspan>    return _engines[name]</text><text x="60" y="2123" class="code"><tspan class="ln"> 88</tspan></text><text x="60" y="2146" class="code"><tspan class="ln"> 89</tspan></text><text x="60" y="2169" class="code"><tspan class="ln"> 90</tspan>@app.on_event(&quot;startup&quot;)</text></svg>